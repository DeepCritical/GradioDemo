name: Documentation

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Build documentation
        run: |
          uv run mkdocs build --strict

      - name: Verify site directory
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          echo "Checking site directory..."
          ls -la site/ | head -20
          echo "Site directory exists: $(test -d site && echo 'yes' || echo 'no')"
          echo "Index.html exists: $(test -f site/index.html && echo 'yes' || echo 'no')"

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Configure git to use token for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Get current branch from GitHub context
          CURRENT_BRANCH="${{ github.ref_name }}"
          echo "Current branch: $CURRENT_BRANCH"
          
          # Always checkout dev branch (even if we're already on it, this ensures we're up to date)
          git fetch origin dev
          git checkout dev
          
          # Remove old built site files that MkDocs generates
          rm -f index.html 404.html sitemap.xml sitemap.xml.gz 2>/dev/null || true
          rm -rf assets search api architecture configuration contributing getting-started overview license team 2>/dev/null || true
          
          # Copy new site files to root (this will add/update site files)
          cp -r site/* .
          
          # Add all changes (site files will be added, source files that exist won't be affected)
          git add -A
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy docs to dev branch [skip ci]"
            git push origin dev
          fi





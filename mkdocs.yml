site_name: DeepCritical
site_description: AI-Native Drug Repurposing Research Agent
site_author: DeepCritical Team
site_url: https://deepcritical.github.io/GradioDemo/

repo_name: DeepCritical/GradioDemo
repo_url: https://github.com/DeepCritical/GradioDemo
edit_uri: edit/dev/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: orange
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: orange
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2
  - codeinclude
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
      preserve_tabs: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
      emoji_index: !!python/name:pymdownx.emoji.twemoji
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Overview:
    - overview/architecture.md
    - overview/features.md
  - Getting Started:
    - getting-started/installation.md
    - getting-started/quick-start.md
    - getting-started/mcp-integration.md
    - getting-started/examples.md
  - Configuration: CONFIGURATION.md
  - Architecture:
    - architecture/overview.md
    - architecture/design-patterns.md
    - architecture/graph_orchestration.md
    - architecture/agents.md
    - architecture/orchestrators.md
    - architecture/tools.md
    - architecture/middleware.md
    - architecture/services.md
  - API Reference:
    - api/agents.md
    - api/tools.md
    - api/orchestrators.md
    - api/services.md
    - api/models.md
  - Contributing:
    - contributing/index.md
    - contributing/code-quality.md
    - contributing/code-style.md
    - contributing/error-handling.md
    - contributing/implementation-patterns.md
    - contributing/prompt-engineering.md
    - contributing/testing.md
  - License: license.md
  - Team: team.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeepCritical/GradioDemo
    - icon: material/web
      link: https://huggingface.co/spaces/DataQuests/DeepCritical

copyright: Copyright &copy; 2024 DeepCritical Team
